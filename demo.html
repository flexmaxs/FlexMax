<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>طلب عرض | FlexMax Accounts</title>
<link rel="icon" href="assets/logo.png"><link rel="stylesheet" href="style.css"><script src="site.js" defer></script>
</head>
<body class="booking"><header class="top"><div class="wrap nav"><a class="brand" href="index.html"><img src="assets/logo.png" alt="" width="42" height="42"><b dir="ltr">FlexMax <span>Accounts</span></b></a><a href="index.html">الرجوع للرئيسية</a></div></header>
<main class="wrap book-grid"><div><p class="eyebrow"><i></i> جولة حسب نشاطك</p><h1>كلمنا<br><em>على واتساب.</em></h1><p class="lead">اختار نشاطك وابعت الطلب على واتساب.</p></div>
<form id="demo-form" class="form"><h2>بيانات طلب العرض</h2><p class="muted">هيفتح معاك واتساب برسالة جاهزة.</p>
<label>الاسم<input name="customer" autocomplete="name" required maxlength="80"></label>
<label>رقم التواصل<input name="phone" type="tel" dir="ltr" autocomplete="tel" required maxlength="30"></label>
<label>نوع النشاط<select name="activity" required><option value="">اختار نوع النشاط</option><option value="market">سوبر ماركت</option><option value="clothes">محل ملابس</option><option value="restaurant">مطعم</option><option value="factory">مصنع</option><option value="payments">محل خدمات دفع</option><option value="other">نشاط آخر</option></select></label>
<button class="button" type="submit">ابعت على واتساب ←</button><p id="form-result" role="status" hidden></p></form></main></body></html>
